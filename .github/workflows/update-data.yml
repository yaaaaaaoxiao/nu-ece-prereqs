name: Update course data

# Re-scrape the catalog monthly (or on demand) and open a pull request when
# anything changed. The PR description lists prerequisites that need a human
# check before merging (see "Updating the data" in the README).
on:
  schedule:
    - cron: "0 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements.txt
      - run: python -m unittest discover scraper
      - name: Scrape
        run: python scraper/scrape.py --report "$RUNNER_TEMP/report.md"
      - name: Open a pull request if the data changed
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data-update
          add-paths: data/*.json
          commit-message: Update course data from the catalog
          title: Update course data from the catalog
          body-path: ${{ runner.temp }}/report.md
